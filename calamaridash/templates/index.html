<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CalamariDash</title><style>body{font:16px system-ui;margin:2rem;background:#20152b;color:#fff}main{max-width:1000px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem}.card{background:#402b52;padding:1rem;border-radius:10px}.value{font-size:2rem;color:#e8c7ff}table{width:100%;margin-top:2rem;background:#30203d;border-radius:10px;padding:1rem}td,th{text-align:left;padding:.5rem}</style></head><body><main><h1>CalamariDash</h1><p>Local contest telemetry and HamDash bridge</p><section class="grid"><div class="card">QSOs<div class="value" id="totalQsos">—</div></div><div class="card">Multipliers<div class="value" id="multiplierCount">—</div></div><div class="card">Score<div class="value" id="score">—</div></div><div class="card">Rate / 20 min<div class="value" id="rate20">—</div></div><div class="card">Rate / 60 min<div class="value" id="rate60">—</div></div><div class="card">Operating time<div class="value" id="totalOpTime">—</div></div></section><h2>Latest QSO</h2><table><tbody id="lastQso"><tr><td>No QSOs received yet.</td></tr></tbody></table></main><script>async function update(){const r=await fetch('/api/metrics');const m=await r.json();for(const k of ['totalQsos','multiplierCount','score','rate20','rate60','totalOpTime'])document.getElementById(k).textContent=m[k]??'—';const q=m.lastQso;document.getElementById('lastQso').innerHTML=q?Object.entries(q).map(([k,v])=>`<tr><th>${k}</th><td>${v??''}</td></tr>`).join(''):'<tr><td>No QSOs received yet.</td></tr>'}update();setInterval(update,2000)</script></body></html>
